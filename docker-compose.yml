services:
  website:
    image: nginx:alpine
    depends_on:
      - proxy
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '80'
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.proxy
    volumes:
      - proxy-data:/app
    restart: unless-stopped

volumes:
  proxy-data:
